<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.2" y1="1" x2="0.8" y2="0">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <!-- Rounded square bg -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Flame outer -->
  <path d="M256,60 C310,60 370,120 370,200 C370,290 320,370 256,430 C192,370 142,290 142,200 C142,120 202,60 256,60Z" fill="#1A1A1A" opacity="0.95"/>
  <!-- Flame inner glow -->
  <path d="M256,100 C300,100 345,150 345,215 C345,290 305,350 256,400 C207,350 167,290 167,215 C167,150 212,100 256,100Z" fill="url(#flame)" opacity="0.2"/>
  <!-- Dumbbell -->
  <g fill="#1A1A1A" stroke="none">
    <!-- Left plate -->
    <rect x="195" y="210" width="30" height="80" rx="6" fill="#1A1A1A"/>
    <!-- Right plate -->
    <rect x="287" y="210" width="30" height="80" rx="6" fill="#1A1A1A"/>
    <!-- Bar -->
    <rect x="220" y="238" width="72" height="24" rx="4" fill="#1A1A1A"/>
    <!-- Left small plate -->
    <rect x="210" y="225" width="15" height="50" rx="4" fill="#1A1A1A"/>
    <!-- Right small plate -->
    <rect x="287" y="225" width="15" height="50" rx="4" fill="#1A1A1A"/>
  </g>
</svg>
